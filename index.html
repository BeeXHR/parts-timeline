<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Parts Timeline</title>
<style>
  body { font-family: -apple-system, sans-serif; margin: 24px; color: #1a1a1a; }
  .legend { display: flex; gap: 16px; margin-bottom: 16px; font-size: 12px; color: #555; }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
  .chart-scroll { overflow-x: auto; border: 1px solid #eee; }
  .chart-inner { position: relative; }
  .ruler { display: flex; position: sticky; top: 0; background: #fff; border-bottom: 1px solid #ddd; z-index: 3; }
  .ruler-label-spacer { width: 220px; flex-shrink: 0; position: sticky; left: 0; background: #fff; z-index: 4; }
  .ruler-tick { position: absolute; top: 0; font-size: 12px; color: #888; padding: 6px 0 6px 6px; border-left: 1px solid #ddd; height: 100%; }
  .row { display: flex; border-top: 1px solid #eee; }
  .label { width: 220px; flex-shrink: 0; font-size: 13px; font-weight: 500; padding: 10px 12px 10px 0; position: sticky; left: 0; background: #fff; z-index: 2; }
  .track { position: relative; }
  .seg-wrap { position: absolute; display: flex; align-items: center; height: 26px; cursor: default; }
  .seg-bar { width: 20px; height: 20px; border-radius: 5px; border: 1px solid; flex-shrink: 0; }
  .seg-bar.done { background: #e6f4ea; border-color: #a8d5b5; }
  .seg-bar.in_progress { background: #fff4e0; border-color: #f0c986; }
  .seg-bar.open { background: #f2f2f2; border-color: #ccc; }
  .seg-bar.scheduled { background: #e8f0fe; border-color: #a9c6f5; }
  .seg-label { margin-left: 6px; font-size: 12px; color: #333; white-space: nowrap; }
  .empty-note { font-size: 12px; color: #aaa; padding: 10px 0; }
  .today-line { position: absolute; top: 0; bottom: 0; width: 1px; background: #e0392b; z-index: 1; }
  .today-dot { position: absolute; top: -8px; width: 14px; height: 14px; background: #e0392b; border-radius: 50%;
               transform: translateX(-50%); left: 0; }
</style>
</head>
<body>
<h2>Parts Timeline</h2>
<div class="legend">
  <span><i style="background:#e6f4ea;border:1px solid #a8d5b5"></i> Done</span>
  <span><i style="background:#fff4e0;border:1px solid #f0c986"></i> In progress</span>
  <span><i style="background:#e8f0fe;border:1px solid #a9c6f5"></i> Scheduled</span>
  <span><i style="background:#f2f2f2;border:1px solid #ccc"></i> Open</span>
</div>
<div class="chart-scroll">
  <div class="chart-inner" id="chartInner"></div>
</div>

<script>
const PX_PER_DAY = 22;
const LANE_HEIGHT = 28;
const PAD_WEEKS = 2;

fetch('data.json?t=' + Date.now())
  .then(r => r.json())
  .then(render);

function formatDateShort(dstr) {
  return new Date(dstr + 'T00:00:00').toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
}

function measureTextWidth(text, font) {
  const canvas = measureTextWidth._canvas || (measureTextWidth._canvas = document.createElement('canvas'));
  const ctx = canvas.getContext('2d');
  ctx.font = font;
  return ctx.measureText(text).width;
}

function render(data) {
  const msPerDay = 24 * 60 * 60 * 1000;
  let rangeStart = new Date(data.range.start).getTime() - PAD_WEEKS * 7 * msPerDay;
  let rangeEnd = new Date(data.range.end).getTime() + PAD_WEEKS * 7 * msPerDay;
  const totalDays = Math.ceil((rangeEnd - rangeStart) / msPerDay);
  const totalWidthPx = totalDays * PX_PER_DAY;

  const chartInner = document.getElementById('chartInner');
  chartInner.style.width = (totalWidthPx + 220) + 'px';

  // Ruler
  const ruler = document.createElement('div');
  ruler.className = 'ruler';
  const rulerSpacer = document.createElement('div');
  rulerSpacer.className = 'ruler-label-spacer';
  ruler.appendChild(rulerSpacer);
  const rulerTrack = document.createElement('div');
  rulerTrack.style.cssText = `position:relative; width:${totalWidthPx}px; height:28px;`;
  const totalWeeks = Math.ceil(totalDays / 7);
  for (let i = 0; i < totalWeeks; i++) {
    const tick = document.createElement('div');
    tick.className = 'ruler-tick';
    tick.style.left = (i * 7 * PX_PER_DAY) + 'px';
    tick.textContent = new Date(rangeStart + i * 7 * msPerDay).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
    rulerTrack.appendChild(tick);
  }
  ruler.appendChild(rulerTrack);
  chartInner.appendChild(ruler);

  // Rows
  data.rows.forEach(r => {
    const row = document.createElement('div');
    row.className = 'row';

    const label = document.createElement('div');
    label.className = 'label';
    label.textContent = r.partName;
    row.appendChild(label);

    const track = document.createElement('div');
    track.className = 'track';
    track.style.width = totalWidthPx + 'px';

    if (!r.segments || r.segments.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'empty-note';
      empty.textContent = 'No dates scheduled yet';
      track.appendChild(empty);
      row.style.minHeight = '40px';
      row.appendChild(track);
      chartInner.appendChild(row);
      return;
    }

    // Compute pixel position + estimated rendered width for each segment
    const font = '12px -apple-system, sans-serif';
    const items = r.segments.map(s => {
      const start = new Date(s.start + 'T00:00:00').getTime();
      const end = new Date(s.end + 'T00:00:00').getTime();
      const leftPx = ((start - rangeStart) / msPerDay) * PX_PER_DAY;
      const dateStr = `${formatDateShort(s.start)} – ${formatDateShort(s.end)}`;
      const textWidth = measureTextWidth(s.label, font);
      const renderedWidth = 20 + 6 + textWidth + 10; // icon + gap + text + margin
      return { ...s, leftPx, renderedWidth, dateStr };
    }).sort((a, b) => a.leftPx - b.leftPx);

    // Assign lanes to avoid overlap
    const laneEnds = [];
    items.forEach(seg => {
      let laneIdx = laneEnds.findIndex(end => seg.leftPx >= end + 8);
      if (laneIdx === -1) {
        laneIdx = laneEnds.length;
        laneEnds.push(seg.leftPx + seg.renderedWidth);
      } else {
        laneEnds[laneIdx] = seg.leftPx + seg.renderedWidth;
      }
      seg.lane = laneIdx;
    });

    const maxLanes = laneEnds.length;
    row.style.minHeight = (maxLanes * LANE_HEIGHT + 12) + 'px';

    items.forEach(seg => {
      const wrap = document.createElement('div');
      wrap.className = 'seg-wrap';
      wrap.style.left = seg.leftPx + 'px';
      wrap.style.top = (6 + seg.lane * LANE_HEIGHT) + 'px';
      wrap.title = `${seg.label} • ${seg.dateStr}`;

      const bar = document.createElement('div');
      bar.className = 'seg-bar ' + (seg.status || 'open');

      const text = document.createElement('div');
      text.className = 'seg-label';
      text.textContent = seg.label;

      wrap.appendChild(bar);
      wrap.appendChild(text);
      track.appendChild(wrap);
    });

    row.appendChild(track);
    chartInner.appendChild(row);
  });

  // Today marker
  const now = Date.now();
  if (now >= rangeStart && now <= rangeEnd) {
    const leftPx = 220 + ((now - rangeStart) / msPerDay) * PX_PER_DAY;
    const line = document.createElement('div');
    line.className = 'today-line';
    line.style.left = leftPx + 'px';
    const dot = document.createElement('div');
    dot.className = 'today-dot';
    line.appendChild(dot);
    chartInner.appendChild(line);

    requestAnimationFrame(() => {
      const scrollContainer = document.querySelector('.chart-scroll');
      scrollContainer.scrollLeft = Math.max(0, leftPx - scrollContainer.clientWidth / 2);
    });
  }
}
</script>
</body>
</html>
