<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Parts Timeline</title>
<style>
  body { font-family: -apple-system, sans-serif; margin: 24px; color: #1a1a1a; }
  .ruler { display: flex; margin-bottom: 6px; padding-left: 220px; font-size: 12px; color: #888; }
  .ruler div { flex: 1; border-left: 1px solid #ddd; padding-left: 6px; }
  .row { display: flex; align-items: center; min-height: 52px; border-top: 1px solid #eee; }
  .label { width: 220px; flex-shrink: 0; font-size: 13px; font-weight: 500; padding-right: 12px; }
  .track { position: relative; flex: 1; height: 36px; }
  .seg { position: absolute; top: 4px; height: 28px; background: #f2f2f2; border: 1px solid #ccc;
         border-radius: 6px; display: flex; align-items: center; padding: 0 8px; overflow: hidden;
         white-space: nowrap; font-size: 12px; color: #444; }
</style>
</head>
<body>
<h2>Parts Timeline</h2>
<div class="ruler" id="ruler"></div>
<div id="rows"></div>

<script>
fetch('data.json?t=' + Date.now())
  .then(r => r.json())
  .then(render);

function render(data) {
  const rangeStart = new Date(data.range.start).getTime();
  const rangeEnd = new Date(data.range.end).getTime();
  const totalMs = rangeEnd - rangeStart;

  const ruler = document.getElementById('ruler');
  const weeks = 5;
  for (let i = 0; i < weeks; i++) {
    const d = new Date(rangeStart + (totalMs / weeks) * i);
    const div = document.createElement('div');
    div.textContent = d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
    ruler.appendChild(div);
  }

  const container = document.getElementById('rows');
  data.rows.forEach(r => {
    const row = document.createElement('div');
    row.className = 'row';

    const label = document.createElement('div');
    label.className = 'label';
    label.textContent = r.partName;
    row.appendChild(label);

    const track = document.createElement('div');
    track.className = 'track';

    r.segments.forEach(s => {
      const start = new Date(s.start).getTime();
      const end = new Date(s.end).getTime();
      const left = ((start - rangeStart) / totalMs) * 100;
      const width = ((end - start) / totalMs) * 100;

      const seg = document.createElement('div');
      seg.className = 'seg';
      seg.style.left = left + '%';
      seg.style.width = width + '%';
      seg.textContent = s.label;
      track.appendChild(seg);
    });

    row.appendChild(track);
    container.appendChild(row);
  });
}
</script>
</body>
</html>
