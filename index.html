<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Parts Timeline</title>
<style>
  body { font-family: -apple-system, sans-serif; margin: 24px; color: #1a1a1a; }
  .legend { display: flex; gap: 16px; margin-bottom: 12px; font-size: 12px; color: #555; }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
  .controls { display: flex; gap: 8px; margin-bottom: 12px; align-items: center; }
  .controls button { font-size: 12px; padding: 6px 12px; border: 1px solid #ccc; border-radius: 6px;
                      background: #fff; cursor: pointer; }
  .controls button:hover { background: #f5f5f5; }
  .controls .refresh { margin-left: auto; }
  .chart-scroll { overflow-x: auto; overflow-y: hidden; border: 1px solid #eee; }
  .chart-inner { position: relative; }
  .ruler { display: flex; position: sticky; top: 0; background: #fff; border-bottom: 1px solid #ddd; z-index: 3; height: 40px; }
  .ruler-label-spacer { width: 220px; flex-shrink: 0; position: sticky; left: 0; background: #fff; z-index: 4; box-sizing: border-box; }
  .ruler-tick { position: absolute; top: 12px; font-size: 12px; color: #888; padding-left: 3px; border-left: 1px solid #ccc; height: 28px; }
  .today-chip { position: absolute; top: 2px; font-size: 11px; font-weight: 600; color: #fff; background: #e0392b;
                padding: 1px 6px; border-radius: 4px; white-space: nowrap; transform: translateX(-50%); z-index: 5; }
  .row { display: flex; border-top: 1px solid #eee; min-height: 46px; }
  .label { width: 220px; flex-shrink: 0; padding: 10px 12px 10px 0; box-sizing: border-box; position: sticky; left: 0; background: #fff; z-index: 2; }
  .label .name { font-size: 13px; font-weight: 500; }
  .label .dates { font-size: 11px; color: #999; margin-top: 2px; }
  .track { position: relative; height: 46px; }
  .seg-bar { position: absolute; top: 13px; height: 20px; border-radius: 2px; border: 1px solid; box-sizing: border-box;
             display: flex; align-items: center; padding: 0 6px; overflow: hidden; white-space: nowrap;
             font-size: 12px; cursor: default; }
  .seg-bar span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .seg-bar.done { background: #e6f4ea; border-color: #a8d5b5; color: #1e6b3c; }
  .seg-bar.in_progress { background: #fff4e0; border-color: #f0c986; color: #8a5a00; }
  .seg-bar.open { background: #f2f2f2; border-color: #ccc; color: #555; }
  .seg-bar.scheduled { background: #e8f0fe; border-color: #a9c6f5; color: #1a4d99; }
  .empty-note { font-size: 12px; color: #aaa; padding: 10px 0; }
  .today-line { position: absolute; top: 40px; bottom: 0; width: 1px; background: #e0392b; z-index: 1; }
</style>
</head>
<body>
<h2>Parts Timeline</h2>
<div class="legend">
  <span><i style="background:#e6f4ea;border:1px solid #a8d5b5"></i> Done</span>
  <span><i style="background:#fff4e0;border:1px solid #f0c986"></i> In progress</span>
  <span><i style="background:#e8f0fe;border:1px solid #a9c6f5"></i> Scheduled</span>
  <span><i style="background:#f2f2f2;border:1px solid #ccc"></i> Open</span>
</div>
<div class="controls">
  <button id="btnBack">◀ Back 1 month</button>
  <button id="btnToday">Today</button>
  <button id="btnForward">Forward 1 month ▶</button>
  <button id="btnRefresh" class="refresh">⟳ Refresh data</button>
</div>
<div class="chart-scroll">
  <div class="chart-inner" id="chartInner"></div>
</div>

<script>
const PX_PER_DAY = 22;
const PAD_WEEKS = 26;

loadAndRender();
document.getElementById('btnRefresh').onclick = loadAndRender;

function loadAndRender() {
  fetch('data.json?t=' + Date.now())
    .then(r => r.json())
    .then(data => {
      document.getElementById('chartInner').innerHTML = '';
      render(data);
    });
}

function formatDateShort(dstr) {
  return new Date(dstr + 'T00:00:00').toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
}

function mondayOnOrBefore(ts) {
  const d = new Date(ts);
  const day = d.getDay();
  const diffToMonday = (day === 0) ? 6 : (day - 1);
  const monday = new Date(d.getFullYear(), d.getMonth(), d.getDate() - diffToMonday);
  return monday.getTime();
}

function render(data) {
  const msPerDay = 24 * 60 * 60 * 1000;
  const rawStart = new Date(data.range.start + 'T00:00:00').getTime() - PAD_WEEKS * 7 * msPerDay;
  const rawEnd = new Date(data.range.end + 'T00:00:00').getTime() + PAD_WEEKS * 7 * msPerDay;

  const rangeStart = mondayOnOrBefore(rawStart);
  const rangeEnd = rawEnd;
  const totalDays = Math.ceil((rangeEnd - rangeStart) / msPerDay);
  const totalWidthPx = totalDays * PX_PER_DAY;

  const chartInner = document.getElementById('chartInner');
  chartInner.style.width = (totalWidthPx + 220) + 'px';

  const ruler = document.createElement('div');
  ruler.className = 'ruler';
  const rulerSpacer = document.createElement('div');
  rulerSpacer.className = 'ruler-label-spacer';
  ruler.appendChild(rulerSpacer);
  const rulerTrack = document.createElement('div');
  rulerTrack.style.cssText = `position:relative; width:${totalWidthPx}px; height:40px;`;
  const totalWeeks = Math.ceil(totalDays / 7);
  for (let i = 0; i < totalWeeks; i++) {
    const tick = document.createElement('div');
    tick.className = 'ruler-tick';
    tick.style.left = (i * 7 * PX_PER_DAY) + 'px';
    const tickDate = new Date(rangeStart + i * 7 * msPerDay);
    tick.textContent = tickDate.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
    rulerTrack.appendChild(tick);
  }
  ruler.appendChild(rulerTrack);
  chartInner.appendChild(ruler);

  data.rows.forEach(r => {
    const row = document.createElement('div');
    row.className = 'row';

    const label = document.createElement('div');
    label.className = 'label';
    const name = document.createElement('div');
    name.className = 'name';
    name.textContent = r.partName;
    label.appendChild(name);

    if (r.mainRange) {
      const dates = document.createElement('div');
      dates.className = 'dates';
      dates.textContent = `${formatDateShort(r.mainRange.start)} – ${formatDateShort(r.mainRange.end)}`;
      label.appendChild(dates);
    }
    row.appendChild(label);

    const track = document.createElement('div');
    track.className = 'track';
    track.style.width = totalWidthPx + 'px';

    if (!r.segments || r.segments.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'empty-note';
      empty.textContent = 'No dates scheduled yet';
      track.appendChild(empty);
      row.appendChild(track);
      chartInner.appendChild(row);
      return;
    }

    r.segments.forEach(s => {
      const start = new Date(s.start + 'T00:00:00').getTime();
      const end = new Date(s.end + 'T00:00:00').getTime();
      const leftPx = ((start - rangeStart) / msPerDay) * PX_PER_DAY;
      const widthPx = ((end - start) / msPerDay) * PX_PER_DAY;
      const dateStr = `${formatDateShort(s.start)} – ${formatDateShort(s.end)}`;

      const bar = document.createElement('div');
      bar.className = 'seg-bar ' + (s.status || 'open');
      bar.style.left = leftPx + 'px';
      bar.style.width = Math.max(widthPx, 4) + 'px';
      bar.title = `${s.label} • ${dateStr}`;

      const text = document.createElement('span');
      text.textContent = s.label;
      bar.appendChild(text);

      track.appendChild(bar);
    });

    row.appendChild(track);
    chartInner.appendChild(row);
  });

  const nowDate = new Date();
  const todayMidnight = new Date(nowDate.getFullYear(), nowDate.getMonth(), nowDate.getDate()).getTime();
  let todayLeftPx = null;
  if (todayMidnight >= rangeStart && todayMidnight <= rangeEnd) {
    todayLeftPx = 220 + ((todayMidnight - rangeStart) / msPerDay) * PX_PER_DAY;

    const line = document.createElement('div');
    line.className = 'today-line';
    line.style.left = todayLeftPx + 'px';
    chartInner.appendChild(line);

    const chip = document.createElement('div');
    chip.className = 'today-chip';
    chip.style.left = (todayLeftPx - 220) + 'px';
    chip.textContent = 'Today, ' + nowDate.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
    rulerTrack.appendChild(chip);
  }

  const scrollContainer = document.querySelector('.chart-scroll');
  const scrollToToday = () => {
    if (todayLeftPx !== null) {
      scrollContainer.scrollLeft = Math.max(0, todayLeftPx - scrollContainer.clientWidth / 2);
    }
  };
  requestAnimationFrame(scrollToToday);

  const monthPx = 30 * PX_PER_DAY;
  document.getElementById('btnBack').onclick = () => { scrollContainer.scrollLeft -= monthPx; };
  document.getElementById('btnForward').onclick = () => { scrollContainer.scrollLeft += monthPx; };
  document.getElementById('btnToday').onclick = scrollToToday;
}
</script>
</body>
</html>
